  <!-- 题干 -->
  <text x="20" y="138" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#1F4A45">QUESTION 12 OF 61</text>
  <text x="20" y="168" class="serif" font-size="19" font-weight="600">According to the text, which of the</text>
  <text x="20" y="194" class="serif" font-size="19" font-weight="600">following statements best describes</text>
  <text x="20" y="220" class="serif" font-size="19" font-weight="600">the modern scholar's duty?</text>

  <!-- 阅读篇章卡 -->
  <rect x="20" y="240" width="335" height="212" rx="10" class="card"/>
  <text x="38" y="266" class="serif" font-size="11.5" fill="#3A4744">The scholarly study of history requires not merely</text>
  <text x="38" y="284" class="serif" font-size="11.5" fill="#3A4744">the passive assimilation of dates and events, but the</text>
  <text x="38" y="302" class="serif" font-size="11.5" fill="#3A4744">active cross-examination of primary evidence. Over</text>
  <text x="38" y="320" class="serif" font-size="11.5" fill="#3A4744">centuries, records are inevitably filtered, edited, or</text>
  <text x="38" y="338" class="serif" font-size="11.5" fill="#3A4744">destroyed by subsequent generations. Hence, the</text>
  <text x="38" y="356" class="serif" font-size="11.5" fill="#3A4744">modern academic must develop a healthy skepticism</text>
  <text x="38" y="374" class="serif" font-size="11.5" fill="#3A4744">toward the neat, linear narratives presented in state-</text>
  <text x="38" y="392" class="serif" font-size="11.5" fill="#3A4744">sponsored archives. Only by contrasting disparate,</text>
  <text x="38" y="410" class="serif" font-size="11.5" fill="#3A4744">often contradictory local accounts can we arrive at</text>
  <text x="38" y="428" class="serif" font-size="11.5" fill="#3A4744">a more authentic approximation of the past.</text>

  <!-- 选项 -->
  <rect x="20" y="472" width="335" height="58" rx="8" fill="#FFFFFF" stroke="#D8D4CC"/>
  <circle cx="40" cy="501" r="8" stroke="#B5B0A6" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="58" y="505" class="sans" font-size="12" font-weight="700">A.</text>
  <text x="80" y="497" class="sans" font-size="11.5">Historical analysis should focus on</text>
  <text x="80" y="513" class="sans" font-size="11.5">memorizing chronological datasets.</text>

  <rect x="20" y="540" width="335" height="58" rx="8" fill="#F2F7F5" stroke="#1F4A45" stroke-width="1.5"/>
  <circle cx="40" cy="569" r="8" fill="#1F4A45"/>
  <circle cx="40" cy="569" r="3" fill="#FFFFFF"/>
  <text x="58" y="573" class="sans" font-size="12" font-weight="700" fill="#1F4A45">B.</text>
  <text x="80" y="565" class="sans" font-size="11.5">Scholars must critically evaluate and</text>
  <text x="80" y="581" class="sans" font-size="11.5">contrast contradictory primary sources.</text>

  <rect x="20" y="608" width="335" height="58" rx="8" fill="#FFFFFF" stroke="#D8D4CC"/>
  <circle cx="40" cy="637" r="8" stroke="#B5B0A6" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="58" y="641" class="sans" font-size="12" font-weight="700">C.</text>
  <text x="80" y="633" class="sans" font-size="11.5">Archives maintained by states are</text>
  <text x="80" y="649" class="sans" font-size="11.5">universally reliable and complete.</text>

  <rect x="20" y="676" width="335" height="58" rx="8" fill="#FFFFFF" stroke="#D8D4CC"/>
  <circle cx="40" cy="705" r="8" stroke="#B5B0A6" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="58" y="709" class="sans" font-size="12" font-weight="700">D.</text>
  <text x="80" y="701" class="sans" font-size="11.5">Contradictory local accounts should be</text>
  <text x="80" y="717" class="sans" font-size="11.5">dismissed as historically invalid.</text>

