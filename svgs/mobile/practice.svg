  <text x="20" y="94" class="sans" font-size="12" font-weight="600">2026 National Exam Paper I</text>
  <text x="355" y="94" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#1F4A45">Q 12 / 61</text>
